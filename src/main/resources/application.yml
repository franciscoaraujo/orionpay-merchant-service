spring:
  application:
    name: orionpay-merchant-service

  # --- BANCO DE DADOS ---
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:5432/orionpay_db
    username: ${SPRING_DATASOURCE_USERNAME:orion_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:orion_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- MENSAGERIA (Corrigido sem duplicatas) ---
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USER:orion_admin}
    password: ${SPRING_RABBITMQ_PASS:orion_password}

  # --- CACHE ---
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # --- CONFIGURAÇÃO DE E-MAIL ---
    name: merchant-service
  
  # Configuração explícita do Redis para evitar ambiguidade de localhost
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # password: se_tiver_senha_coloque_aqui

  mail:
    host: smtp.gmail.com
    port: 587
    username: bitwisebytes@gmail.com
    password: ${MAIL_PASSWORD} # Passe via variável de ambiente ou injete aqui
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

# --- SERVIDOR ---
server:
  port: 8085

# --- SEGURANÇA E JWT ---
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-minutes: 60
  refresh-token-expiration-days: 7

# --- RESILIÊNCIA ---
resilience4j:
  circuitbreaker:
    instances:
      ledgerCircuitBreaker:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
        registerHealthIndicator: true
  bulkhead:
    instances:
      ledgerBulkhead:
        maxConcurrentCalls: 5
        registerHealthIndicator: true

# --- MONITORAMENTO ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, circuitbreakers, bulkheads
  endpoint:
    health:
      show-details: always

# --- USUÁRIO DE MONITORAMENTO (APM) ---
monitoring:
  user:
    name: apm-agent
    password: ${MONITORING_PASSWORD:ChangeThisPasswordInProd}
  jpa:
    open-in-view: false
    # database-platform: org.hibernate.dialect.PostgreSQLDialect  <-- REMOVIDO
    hibernate:
      # Use 'none' ou 'validate' em produção. 'update' apenas para desenvolvimento.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Define o schema padrão para evitar ter que prefixar todas as tabelas
        default_schema: core
        # Otimização para alto volume de transações
        jdbc:
          batch_size: 20
          order_inserts: false
          order_updates: false

  # Configuração de Logs específica para o Spring
  output:
    ansi:
      enabled: always

logging:
  config: classpath:logback-spring.xml # Link com o arquivo que criamos antes
